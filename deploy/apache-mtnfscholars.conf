# Apache reverse proxy for the voting platform (blue/green: the backend port comes from MTN_PORT).
# deploy/deploy.sh sets this up automatically on first run; manual install:
#   echo "Define MTN_PORT 3110" | sudo tee /etc/apache2/conf-available/mtn-scholars-port.conf && sudo a2enconf mtn-scholars-port
#   sudo cp deploy/apache-mtnfscholars.conf /etc/apache2/sites-available/mtnfscholars.conf
#   sudo a2ensite mtnfscholars && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d mtnfscholars.dragnet.ng        (adds HTTPS and the HTTP→HTTPS redirect)
<VirtualHost *:80>
    ServerName mtnfscholars.dragnet.ng

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass        / http://127.0.0.1:${MTN_PORT}/
    ProxyPassReverse / http://127.0.0.1:${MTN_PORT}/

    # Voters upload nothing; admin file uploads are capped at 5 MB by the app.
    LimitRequestBody 6291456

    ErrorLog  ${APACHE_LOG_DIR}/mtnfscholars-error.log
    CustomLog ${APACHE_LOG_DIR}/mtnfscholars-access.log combined
</VirtualHost>
